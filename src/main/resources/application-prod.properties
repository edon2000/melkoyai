# Production Configuration for Render + Supabase
# Database Configuration - Supabase (Direct Connection)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1astigmastism1@a
quarkus.datasource.jdbc.url=jdbc:postgresql://db.pkdmonstyusgkjaqzm.supabase.co:5432/postgres

# Database Connection Pool
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30s
quarkus.datasource.jdbc.leak-detection-interval=10M

# HTTP Configuration for Render
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Disable HTTPS for Render (Render handles SSL)
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=enabled

# CORS Configuration for Production (Allow all origins)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.credentials=true

# Security Headers
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-XSS-Protection".value=1; mode=block

# Rate Limiting
quarkus.http.limits.max-body-size=10M
quarkus.http.limits.max-header-size=8K

# Production Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."ROOT".level=INFO

# Reduce framework noise
quarkus.log.category."io.vertx".level=WARN
quarkus.log.category."io.netty".level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.jboss".level=WARN
quarkus.log.category."org.hibernate".level=WARN

# Application logging
quarkus.log.category."elonmusk".level=INFO

# Health Check
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.enable=true

# Disable dev features
quarkus.live-reload.instrumentation=false