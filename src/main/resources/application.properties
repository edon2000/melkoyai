# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:gedamgedam}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/elonmusk_db}

# Database Schema Management
quarkus.hibernate-orm.database.generation=none
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=10s
quarkus.datasource.jdbc.leak-detection-interval=10M

# HTTP Configuration
quarkus.http.host=localhost
quarkus.http.port=8080
quarkus.http.ssl-port=8443

# HTTPS Configuration
quarkus.http.ssl.certificate.key-store-file=keystore.p12
quarkus.http.ssl.certificate.key-store-password=changeit
quarkus.http.ssl.certificate.key-store-file-type=PKCS12
quarkus.http.insecure-requests=redirect

# Security Headers - Disable CSP to allow JavaScript
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-XSS-Protection".value=1; mode=block
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# CORS Configuration
# In production, set CORS_ORIGINS environment variable
# Example: CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://localhost:8443,http://localhost:8080}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.credentials=true

# Rate Limiting
quarkus.http.limits.max-body-size=10M
quarkus.http.limits.max-header-size=8K

# Logging Configuration - Appropriate levels for production
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."ROOT".level=INFO

# Framework logging - reduce noise but keep warnings
quarkus.log.category."io.vertx".level=WARN
quarkus.log.category."io.netty".level=WARN
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."org.jboss".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.apache".level=WARN

# Application Logging - INFO level for business logic, ERROR for critical issues
quarkus.log.category."elonmusk".level=INFO
quarkus.log.category."elonmusk.service".level=INFO
quarkus.log.category."elonmusk.controller".level=INFO
quarkus.log.category."elonmusk.exception".level=WARN

# Security logging - always log security events
quarkus.log.category."elonmusk.service.SecurityService".level=INFO
quarkus.log.category."elonmusk.service.AuthService".level=INFO
quarkus.log.category."elonmusk.controller.AdminController".level=INFO

# File logging (optional, enable for production)
quarkus.log.file.enable=false

# Health Check Configuration
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.enable=false

# Metrics Configuration
quarkus.micrometer.enabled=false
quarkus.micrometer.export.prometheus.enabled=false

# Development Configuration
quarkus.live-reload.instrumentation=true
%dev.quarkus.http.insecure-requests=enabled
%dev.quarkus.log.console.enable=false